<style>
:root{
  --bone:#ECF0EF; --bone-2:#DFE6E5; --paper:#F8FCFB; --ink:#061719; --ink-2:#2E4547; --mute:#6E8584;
  --win:#061719; --acc:#1C6168; --acc-d:#0F4A50; --acc-l:#9CC3C3; --petrol:#0F3A3F; --panel:#142528; --beam:#E9FFFB;
  --g:clamp(16px,5vw,72px); --r:20px;
  --sans:"General Sans","Helvetica Neue",Arial,sans-serif;
  --ar:"Alexandria","General Sans",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bone);color:var(--ink);-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{font-family:var(--sans);font-weight:400;background:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.locked{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,video,canvas{display:block}
::selection{background:var(--acc);color:var(--paper)}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;text-transform:uppercase;font-weight:500}

/* ---------- Arabic ---------- */
[dir=rtl] body{font-family:var(--ar)}
[dir=rtl] .mono{font-family:var(--ar);font-size:12.5px;letter-spacing:0;font-weight:500}
[dir=rtl] .big,[dir=rtl] .tab h1,[dir=rtl] .whead h2,[dir=rtl] .pc h3,[dir=rtl] .irow b,[dir=rtl] .reel .wd,[dir=rtl] .fin .end h3,[dir=rtl] .lets,[dir=rtl] #menu .tile b,[dir=rtl] .wm{letter-spacing:0}
[dir=rtl] .big{line-height:1.22;font-weight:500}
[dir=rtl] .tab h1{line-height:1.25;font-weight:600}
[dir=rtl] .fin .end h3{line-height:1.25;font-weight:500}
[dir=rtl] .whead h2{line-height:1.2;font-weight:500}
[dir=rtl] .reel .wd{font-weight:500}
[dir=rtl] .lets{line-height:1.2;font-weight:600}
[dir=rtl] .lets .ch{height:1.22em}
[dir=rtl] .ln{padding-bottom:.14em;margin-bottom:-.14em}
[dir=rtl] .lead{line-height:1.8}
[dir=rtl] .fin .kin .blk{line-height:1.5;font-weight:600}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--bone);overflow:hidden}
#loader .stack{position:absolute;left:50%;top:44%;width:clamp(150px,16vw,220px);aspect-ratio:968/1080;transform:translate(-50%,-50%)}
#loader .stack .logo-img{position:absolute;inset:0;width:100%;height:100%}
#loader .stack .ghost{color:rgba(248,252,251,.1)}
#loader .stack .lit{color:var(--paper);clip-path:inset(0 100% 0 0);filter:drop-shadow(0 0 18px rgba(156,195,195,.3))}
#loader .lcount{position:absolute;right:calc(var(--g) - .06em);bottom:28px;font-family:var(--sans);font-size:clamp(88px,13vw,190px);font-weight:500;letter-spacing:-.05em;line-height:1;display:flex;overflow:hidden;height:1em;direction:ltr}
#loader .lcount .dg{display:block;height:1em;overflow:hidden;width:.6em;text-align:center}
#loader .lcount .dg i{display:block;font-style:normal;transition:transform .32s var(--ease);line-height:1}
#loader .lnote{position:absolute;left:var(--g);bottom:44px;color:#7E9796}
#loader .lnote b{color:var(--acc-l);font-weight:500}
#loader .lwipe{position:absolute;inset:0;background:var(--petrol);transform:scaleY(0);transform-origin:50% 100%}

/* ---------- chrome ---------- */
.chrome{position:fixed;left:0;right:0;top:0;z-index:50;height:120px;padding:44px var(--g) 0;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;transition:color .4s,transform .7s var(--ease)}
.chrome.hid{transform:translateY(-130%)}
.chrome>*{pointer-events:auto}
.wm{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-weight:600;font-size:30px;letter-spacing:-.045em;line-height:44px;direction:ltr}
.logo-img{display:block;background:currentColor;-webkit-mask:url(media/logo.png) center/contain no-repeat;mask:url(media/logo.png) center/contain no-repeat}
.wm .logo{height:76px;width:68px;margin-top:-16px}
.flogo{display:flex;align-items:flex-end;gap:12px}
.flogo .logo{height:46px;width:41px}
.wm sup{font-size:.42em;font-weight:500;letter-spacing:0;position:relative;top:-.55em;margin-left:2px;color:var(--acc-d)}
.chrome.dark .wm sup{color:var(--acc-l)}
.glyph{position:relative;width:22px;height:24px;flex:none}
.glyph i{position:absolute;border-radius:2.5px;background:currentColor}
.glyph i:nth-child(1){left:0;top:0;width:7px;height:24px}
.glyph i:nth-child(2){left:9px;top:0;width:13px;height:6.5px}
.glyph i:nth-child(3){left:9px;top:8.75px;width:10px;height:6.5px;background:var(--acc)}
.glyph i:nth-child(4){left:9px;top:17.5px;width:13px;height:6.5px}
.ticker{position:absolute;left:50%;top:44px;transform:translateX(-50%);height:44px;display:flex;align-items:center;gap:10px;pointer-events:none}
.ticker .tw{height:18px;overflow:hidden;position:relative;width:320px}
.ticker .tw span{position:absolute;inset-inline-start:0;top:0;white-space:nowrap;transition:transform .8s var(--ease),opacity .8s}
.ticker .sq{width:7px;height:7px;border-radius:2px;background:var(--acc);flex:none}
.cta{display:flex;align-items:center;gap:10px}
.talk{height:44px;padding:0 20px 0 18px;border-radius:44px;background:var(--petrol);color:var(--paper);display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;letter-spacing:-.005em;transition:transform .5s var(--ease)}
.talk .dot{width:8px;height:8px;border-radius:50%;background:var(--acc-l);box-shadow:0 0 0 0 rgba(156,195,195,.6);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(156,195,195,.55)}70%{box-shadow:0 0 0 9px rgba(156,195,195,0)}100%{box-shadow:0 0 0 0 rgba(156,195,195,0)}}
.talk .ar{display:inline-block;transition:transform .5s var(--ease)}
.talk:hover .ar{transform:translate(2px,-2px)}
[dir=rtl] .talk:hover .ar{transform:translate(-2px,-2px)}
.lang{height:44px;min-width:44px;padding:0 14px;border-radius:44px;background:var(--paper);color:var(--ink);font-size:14px;font-weight:600;display:grid;place-items:center;transition:background .3s,color .3s}
.lang:hover{background:var(--acc);color:var(--paper)}
.lang[data-to=ar]{font-family:var(--ar);font-size:16px}
.lang[data-to=en]{font-family:var(--sans)}
.mbtn{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;transition:background .3s, transform .6s var(--ease)}
.mbtn .g4{display:grid;grid-template-columns:repeat(2,6px);gap:4px;transition:transform .6s var(--ease)}
.mbtn .g4 i{width:6px;height:6px;border-radius:2px;background:var(--petrol);transition:transform .5s var(--ease),border-radius .5s}
.mbtn:hover .g4 i:nth-child(1){transform:translate(-1px,-1px)}
.mbtn:hover .g4 i:nth-child(4){transform:translate(1px,1px)}
body.menu-open .mbtn .g4{transform:rotate(45deg)}
body.menu-open .mbtn .g4 i{border-radius:50%}
.chrome.dark{color:var(--paper)}
.gauge.foot-on{color:var(--paper)}
.chrome.dark .talk{background:var(--paper);color:var(--ink)}
.chrome.dark .talk .dot{background:var(--acc)}

/* menu */
#menu{position:fixed;z-index:49;top:100px;inset-inline-end:var(--g);width:min(440px,calc(100vw - 2*var(--g)));background:var(--paper);border-radius:22px;padding:10px;box-shadow:0 30px 80px -30px rgba(6,27,29,.4);transform-origin:100% 0;transform:scale(.92) translateY(-8px);opacity:0;visibility:hidden;transition:transform .55s var(--ease),opacity .35s,visibility 0s .55s}
[dir=rtl] #menu{transform-origin:0 0}
body.menu-open #menu{transform:none;opacity:1;visibility:visible;transition:transform .55s var(--ease),opacity .25s,visibility 0s}
#menu .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#menu .tile{position:relative;height:128px;border-radius:14px;background:var(--bone);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;transition:background .35s}
#menu .tile b{font-weight:500;font-size:34px;letter-spacing:-.04em;line-height:1.1}
[dir=rtl] #menu .tile b{font-size:28px}
#menu .tile .mono{color:var(--mute)}
#menu .tile:hover{background:var(--petrol);color:var(--paper)}
#menu .tile:hover .mono{color:var(--acc-l)}
#menu .tile.on::after{content:"";position:absolute;inset-inline-end:16px;top:16px;width:8px;height:8px;border-radius:2px;background:var(--acc)}
#menu .nl{margin-top:8px;border-radius:14px;background:var(--bone);padding:16px;display:flex;gap:10px;align-items:center;justify-content:space-between}
#menu .nl p{font-size:15px;line-height:1.35;letter-spacing:-.01em}
#menu .nl form{display:flex;align-items:center;background:var(--paper);border-radius:40px;height:40px;padding-inline:14px 4px;flex:1;max-width:220px}
#menu .nl input{border:0;background:none;outline:0;font:inherit;font-size:13px;width:100%}
#menu .nl button{width:32px;height:32px;border-radius:50%;background:var(--petrol);color:var(--paper);flex:none}
#menu .mrow{margin-top:8px;display:flex;justify-content:space-between;align-items:center;border-radius:14px;background:var(--petrol);color:var(--paper);padding:14px 16px}
#menu .mrow b{color:var(--acc-l);font-weight:500}

/* gauge */
.gauge{position:fixed;right:22px;bottom:28px;z-index:40;display:flex;align-items:flex-end;gap:10px;color:var(--ink);transition:color .4s;pointer-events:none;direction:ltr;font-family:var(--mono)!important}
.gauge .trk{width:2px;height:64px;background:rgba(6,27,29,.14);border-radius:2px;position:relative;overflow:hidden}
.gauge .trk i{position:absolute;left:0;top:0;width:2px;height:100%;background:currentColor;transform-origin:50% 0;transform:scaleY(0)}
.gauge.dark{color:var(--paper)}
.gauge.dark .trk{background:rgba(255,255,255,.18)}

main{position:relative;z-index:2}
#ribbon{position:fixed;inset:0;width:100vw;height:100vh;z-index:1;pointer-events:none}

/* ---------- hero ---------- */
.hero{position:relative;height:100vh;min-height:640px;padding:120px var(--g) 0}
.win{position:relative;height:calc(100% - 72px);border-radius:var(--r);background:var(--win);overflow:hidden;transform-origin:50% 40%}
.win canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.win .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.win.live .still{opacity:0;transition:opacity .6s}
.win .hint{position:absolute;inset-inline-end:22px;bottom:20px;display:flex;gap:8px;pointer-events:none}
.win .hint span{height:30px;padding:0 12px;border-radius:30px;display:flex;align-items:center;background:rgba(248,252,251,.1);color:rgba(248,252,251,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.win .hint span b{width:6px;height:6px;border-radius:2px;background:var(--acc-l);margin-inline-end:8px}
.win .corner{position:absolute;inset-inline-start:22px;top:20px;color:rgba(248,252,251,.6);pointer-events:none}
.tab{position:absolute;left:var(--g);bottom:72px;padding:26px 30px 0 0;pointer-events:none;z-index:2}
[dir=rtl] .tab{left:auto;right:var(--g);padding:26px 0 0 30px}
.tab h1{font-weight:500;font-size:clamp(34px,4.1vw,60px);line-height:.98;letter-spacing:-.045em}
.tab h1 em{font-style:normal;color:var(--acc-d)}
.hrow{position:absolute;left:var(--g);right:var(--g);bottom:0;height:72px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.hrow>div{display:flex;align-items:center;gap:10px}
.hrow>div:nth-child(2){justify-content:center}
.hrow>div:nth-child(3){justify-content:center}
.hrow>div:last-child{justify-content:flex-end}
.hrow .bk{width:7px;height:7px;border-radius:2px;background:var(--ink)}
.hrow .bk.o{background:var(--acc)}
.hrow .scroll{display:flex;gap:6px;align-items:center}
.hrow .scroll i{display:block;width:10px;height:14px;position:relative;overflow:hidden}
.hrow .scroll i::before{content:"↓";position:absolute;left:0;top:0;font-style:normal;animation:dn 1.6s var(--ease) infinite}
@keyframes dn{0%{transform:translateY(-100%)}50%{transform:none}100%{transform:translateY(100%)}}

/* ---------- reveal lines ---------- */
.ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.ln>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.in .ln>span{transform:none}
.in .ln:nth-child(2)>span{transition-delay:.08s}
.in .ln:nth-child(3)>span{transition-delay:.16s}
.fade{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1.1s var(--ease)}
.in .fade,.fade.in{opacity:1;transform:none}

/* ---------- statement ---------- */
.stmt{position:relative;padding:24vh var(--g) 22vh}
.big{font-weight:400;font-size:clamp(52px,10.4vw,152px);line-height:.98;letter-spacing:-.05em}
.stmt .big .ln:nth-child(2){padding-inline-start:20vw}
.big em{font-style:normal;color:var(--acc-d)}
.cols{display:grid;grid-template-columns:49fr 51fr;margin-top:clamp(48px,9vh,110px)}
.cols .txt{max-width:620px}
.lead{font-size:clamp(18px,1.46vw,21px);line-height:1.43;letter-spacing:-.012em;color:var(--ink)}
.lead+.lead{margin-top:1em}
.pill{display:inline-flex;align-items:center;gap:12px;height:48px;padding-inline:22px 24px;border-radius:48px;background:var(--paper);font-size:14px;font-weight:500;margin-top:40px;transition:background .35s,color .35s;box-shadow:0 1px 0 rgba(6,27,29,.04)}
.pill i{width:7px;height:7px;border-radius:2px;background:var(--ink);transition:transform .5s var(--ease),background .3s}
.pill:hover{background:var(--petrol);color:var(--paper)}
.pill:hover i{background:var(--acc);transform:rotate(45deg)}
.rider{position:fixed;left:0;top:0;z-index:3;width:clamp(240px,25vw,360px);aspect-ratio:36/25;border-radius:16px;overflow:hidden;pointer-events:none;opacity:0;will-change:transform;box-shadow:0 30px 60px -30px rgba(6,27,29,.5);background:#123236}
.rider img{width:100%;height:100%;object-fit:cover}
.rider .rl{position:absolute;inset-inline-start:12px;bottom:10px;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.stmt-spacer{height:clamp(160px,22vw,320px)}

/* ---------- reel ---------- */
.reel{position:relative;height:280vh}
.reel .stick{position:sticky;top:0;height:100vh;overflow:hidden}
.reel .card{position:absolute;left:50%;top:50%;border-radius:var(--r);overflow:hidden;background:#0B2629;will-change:width,height,transform;cursor:none}
.reel .card video,.reel .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reel .card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,27,29,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(6,27,29,.3))}
.reel .words{position:absolute;inset:0;pointer-events:none;z-index:2}
.reel .words.w{color:#fff;z-index:3}
.reel .wd{position:absolute;left:0;top:50%;font-weight:400;font-size:clamp(64px,12.4vw,180px);letter-spacing:-.055em;line-height:1;transform:translateY(-52%);white-space:nowrap}
[dir=rtl] .reel .wd{font-size:clamp(56px,10.4vw,150px);line-height:1.25}
.reel .playb{position:absolute;left:0;top:0;z-index:4;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;background:var(--petrol);color:var(--paper);display:grid;place-items:center;pointer-events:none;transform:scale(0);transition:transform .45s var(--ease)}
.reel .playb span{display:flex;flex-direction:column;align-items:center;gap:4px}
.reel .playb svg{width:18px;height:18px}
.reel .playb.on{transform:scale(1)}
.reel .meta{position:absolute;left:var(--g);right:var(--g);bottom:26px;display:flex;justify-content:space-between;z-index:4;pointer-events:none}
.reel .tmark{position:absolute;left:0;top:0;z-index:3;width:11px;height:11px;pointer-events:none}
.reel .tmark::before,.reel .tmark::after{content:"";position:absolute;background:var(--ink)}
.reel .tmark::before{left:5px;top:0;width:1px;height:11px}
.reel .tmark::after{left:0;top:5px;width:11px;height:1px}

/* ---------- work ---------- */
.work{position:relative;padding:18vh var(--g) 14vh}
.whead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:72px}
.whead h2{font-weight:400;font-size:clamp(46px,5.6vw,82px);letter-spacing:-.05em;line-height:.95}
.whead h2 sup{font-family:var(--mono);font-size:13px;letter-spacing:0;vertical-align:top;position:relative;top:.5em;margin-inline-start:8px;color:var(--acc-d)}
.whead .r{display:flex;flex-direction:column;align-items:flex-end;gap:18px}
.whead .blurb{max-width:320px;text-align:end;color:var(--ink-2);line-height:1.5}
.tog{display:flex;background:var(--paper);border-radius:44px;padding:4px;position:relative;direction:ltr}
.tog button{position:relative;z-index:1;height:36px;padding:0 18px;border-radius:36px;font-size:13px;font-weight:500;transition:color .4s}
[dir=rtl] .tog button{font-family:var(--ar)}
.tog button.on{color:var(--paper)}
.tog .kn{position:absolute;top:4px;left:4px;height:36px;border-radius:36px;background:var(--petrol);transition:transform .55s var(--ease),width .55s var(--ease)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);column-gap:30px;row-gap:84px;align-items:start}
.grid .pc{grid-column:span 7}
.grid .pc:nth-child(4n+2),.grid .pc:nth-child(4n+3){grid-column:span 5;margin-top:96px}
.grid .pc:nth-child(4n+2) .im,.grid .pc:nth-child(4n+3) .im{aspect-ratio:5/5.6}
.pc{display:block;position:relative}
.pc .im{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--bone-2);transform:translateZ(0)}
.pc.wide .im{aspect-ratio:16/11}
.pc .im img{width:100%;height:100%;object-fit:cover;transform:scale(1.08);transition:transform 1.2s var(--ease)}
.pc:hover .im img{transform:scale(1.03)}
.pc .chip{position:absolute;inset-inline-end:16px;top:16px;width:52px;height:52px;border-radius:50%;background:var(--petrol);color:var(--paper);display:grid;place-items:center;font-size:20px;transform:scale(0) rotate(-45deg);transition:transform .55s var(--ease)}
.pc:hover .chip{transform:none}

try { if (glOK) initHero(); } catch (e) { console.warn('hero gl failed', e); glOK = false; document.documentElement.classList.add('nogl'); }
try { if (glOK) initRibbons(); } catch (e) { console.warn('ribbon gl failed', e); }
try { if (glOK) initFinale(); } catch (e) { console.warn('finale gl failed', e); }
applyLang();
window.__loadTarget = window.__loadTarget || (() => {});
if (!window.__lifted) runLoader(() => {
  window.__lifted = 'loader'; window.__booted = true;
  document.body.classList.remove('locked');
  if (hero.ready) $('#win').classList.add('live');
  $('#win').animate([{ transform: 'scale(.94)' }, { transform: 'none' }], { duration: 1400, easing: 'cubic-bezier(.16,1,.3,1)' });
  $('.tab h1').classList.remove('in'); requestAnimationFrame(() => $('.tab h1').classList.add('in'));
});
setTimeout(() => window.__loadTarget(100), 8000);
(async () => {
  window.__loadTarget(20);
  try { await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch (e) { }
  window.__loadTarget(45);
  try { if (hero.warm) hero.warm(); } catch (e) { }
  window.__loadTarget(70);
  await new Promise(r => setTimeout(r, 60));
  try { if (fin.warm) fin.warm(); } catch (e) { }
  window.__loadTarget(88);
  await Promise.race([Promise.all($$('#grid img').slice(0, 2).map(i => i.decode().catch(() => {}))), new Promise(r => setTimeout(r, 1500))]);
  window.__loadTarget(100);
})();

function frame(now) {
  if (lenis) lenis.raf(now);
  const sy = window.scrollY;
  if (hero.tick) hero.tick(now);
  if (rib.tick) rib.tick(sy);
  if (reel.tick) reel.tick(sy);
  if (fin.tick) fin.tick(sy, now);
  chromeTick(sy);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize', () => { VW = innerWidth; VH = innerHeight; });
</script>
</body>
</html>
